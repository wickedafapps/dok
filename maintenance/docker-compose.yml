# managed-by: wickedafdok-maintenance
# On-demand maintenance and installation container. It is normally started by
# setup.sh, the Dok UI, or a Host Helper request. It is intentionally not kept
# running with the Dok installation.
name: wickedafdok-maintenance

services:
  maintenance:
    image: wickedafdok:latest
    container_name: wickedafdok-maintenance
    restart: "no"
    privileged: true
    working_dir: /app
    command: ["node", "/app/maintenance/server.js"]
    ports:
      - "${MAINTENANCE_PORT:-8090}:8090"
    volumes:
      - ${DOCKER_SOCK:-/var/run/docker.sock}:/var/run/docker.sock
      # Code checkout (read/write): installation, updates, and repair target.
      - type: bind
        source: "${DOK_SOURCE_PATH:-..}"
        target: /dok-source
      # Dok persistent data root. Before installation this points at the
      # checkout for compatibility; afterwards it is <data location>/Dok.
      - type: bind
        source: "${DOK_STORAGE_ROOT:-..}"
        target: /dok
      # Dedicated maintenance storage, moved under the Dok data root by the
      # installer. setup.sh sets MAINTENANCE_DATA_PATH to an absolute host path.
      - type: bind
        source: "${MAINTENANCE_DATA_PATH:?MAINTENANCE_DATA_PATH must be an absolute host path outside the Dok checkout}"
        target: /maintenance-data
      # Whole host filesystem for the Host Helper replacement and host paths.
      - type: bind
        source: "${HOST_PATH:-/}"
        target: /host
        bind:
          propagation: rslave
    environment:
      - DOK_ROOT=/dok
      - DOK_SOURCE_ROOT=/dok-source
      - DOK_STORAGE_HOST_PATH=${DOK_STORAGE_ROOT:-..}
      - MAINTENANCE_DATA=/maintenance-data
      - "MAINTENANCE_DATA_HOST_PATH=${MAINTENANCE_DATA_PATH:?MAINTENANCE_DATA_PATH must be set}"
      - HOST_ROOT=/host
      - DOK_HOST_PATH=${DOK_SOURCE_PATH:-..}
      - DOK_CONTAINER=wickedafdok
      - DOK_PORT=8080
      - DOCKER_SOCK=${DOCKER_SOCK:-/var/run/docker.sock}
      - DOK_UID=${PUID:-0}
      - DOK_GID=${PGID:-0}
      - MAINTENANCE_PORT=8090
      - MAINTENANCE_URL=${MAINTENANCE_URL:-http://localhost:8090}
      - MAINTENANCE_REQUIRE_TOKEN=${MAINTENANCE_REQUIRE_TOKEN:-1}
      - MAINTENANCE_TOKEN_FILE=/dok/data/.maintenance-token
      - OPENCODE_BIN=/usr/local/bin/opencode
    networks:
      - wicked
    labels:
      - dok.managed=true
      - dok.maintenance=true
      - dok.role=maintenance
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8090/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

networks:
  wicked:
    external: true
    name: wicked
