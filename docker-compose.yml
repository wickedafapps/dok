services:
  wickedafdok:
    image: wickedafdok:latest
    build: .
    container_name: wickedafdok
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./data:/app/data
      - ./sources:/app/sources
      - ./uploads:/app/uploads
      - ./apps:/app/apps
      - ./core:/app/core
    environment:
      - PORT=8080
    privileged: false
    user: root
    networks:
      - wicked

networks:
  wicked:
    external: true
    name: wicked

