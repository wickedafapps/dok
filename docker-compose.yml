name: wickedafdok

services:
  wickedafdok:
    image: wickedafdok:latest
    build: .
    container_name: wickedafdok
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${DOK_STORAGE_ROOT:-.}/data:/app/data
      - ${DOK_STORAGE_ROOT:-.}/sources:/app/sources
      - ${DOK_STORAGE_ROOT:-.}/uploads:/app/uploads
      - ${DOK_STORAGE_ROOT:-.}/apps:/app/apps
      - ${DOK_STORAGE_ROOT:-.}/core:/app/core
      # Host checkout used by in-app Git updates. The updater pulls here and
      # rebuilds the image, so changes survive container recreation. Keep this
      # an absolute host path when Docker Compose runs from another container
      # (Maintenance); start.sh and the installer set DOK_SOURCE_PATH.
      - ${DOK_SOURCE_PATH:-.}:/app/host-source
    environment:
      - PORT=8080
      - DOK_STORAGE_ROOT=${DOK_STORAGE_ROOT:-}
      - DOK_SOURCE_HOST_PATH=${DOK_SOURCE_PATH:-}
    privileged: false
    user: root
    networks:
      - wicked

networks:
  wicked:
    external: true
    name: wicked
